<!DOCTYPE html>
<html>
<head>
  <title>OpenMyCarIL - Tesla TV Player v3</title>
  <link rel="icon" href="https://images.shulcloud.com/1105/uploads/OTT/vbstv-square-icon-512.jpg" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      position: relative;
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      display: flex;
    }
    #supportButton {
      display: block;
      font-family: tahoma;
      text-align: center;
      padding-bottom: 10px;
    }
    #supportButton a {
      text-decoration: none;
      color: #aaa;
      font-size: 20px;
    }
    #content {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #channelPicker {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100vh;
    }
    #channelPicker button {
      margin: 5px 0;
      cursor: pointer;
    }
    #channelPicker img {
      width: 100px;
      height: auto;
    }
    #videoContainer {
      flex: 1;
      text-align: center;
      position: relative;
    }
    #displayImg {
      width: 95%;
      max-height: 90%;
      margin: 0 auto;
      display: block;
      background: #000;
    }
    #hiddenVideo {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
    #renderCanvas {
      width: 95%;
      max-height: 90%;
      margin: 0 auto;
      display: none;
      background: #000;
    }
    #videoContainer iframe {
      width: 95%;
      height: 90%;
    }
    #debugPanel {
      position: fixed;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      padding: 8px 12px;
      font-size: 12px;
      font-family: monospace;
      border-radius: 4px;
      z-index: 9999;
      line-height: 1.6;
      min-width: 300px;
      text-align: left;
    }
    .debug-ok { color: #0f0; }
    .debug-fail { color: #f00; }
    .debug-warn { color: #ff0; }
    .debug-info { color: #0ff; }
  </style>
</head>
<body>
  <div id="channelPicker"></div>
  <div id="content">
    <div id="supportButton">
      <a href="https://OpenMyCar-IL.com" target="_blank">
        OpenMyCar-IL.com - FREE ISRAELI&WORLDWIDE TV CHANNELS
      </a>
    </div>
    <div id="videoContainer">
      <video id="hiddenVideo" playsinline></video>
      <canvas id="renderCanvas"></canvas>
      <img id="displayImg" alt="TV Stream" />
    </div>
  </div>
  <div id="debugPanel">Waiting for channel...</div>

  <script>
    var currentHls = null;
    var frameLoopId = null;
    var frameCount = 0;
    var lastFpsUpdate = Date.now();
    var currentBlobUrl = null;
    var activeMethod = 'none';
    var methodStatus = {};

    var hiddenVideo = document.getElementById('hiddenVideo');
    var renderCanvas = document.getElementById('renderCanvas');
    var displayImg = document.getElementById('displayImg');
    var debugPanel = document.getElementById('debugPanel');

    function updateDebug(extra) {
      var lines = [];
      lines.push('=== TESLA v3 MULTI-METHOD ===');
      lines.push('Active: <span class="debug-info">' + activeMethod + '</span>');
      lines.push('Video readyState: ' + hiddenVideo.readyState + '/4');
      lines.push('Video paused: ' + hiddenVideo.paused);
      lines.push('Video currentTime: ' + (hiddenVideo.currentTime || 0).toFixed(1) + 's');
      lines.push('---');
      var methods = Object.keys(methodStatus);
      for (var i = 0; i < methods.length; i++) {
        var m = methods[i];
        var s = methodStatus[m];
        var cls = s === 'OK' ? 'debug-ok' : (s === 'BLOCKED' ? 'debug-fail' : 'debug-warn');
        lines.push(m + ': <span class="' + cls + '">' + s + '</span>');
      }
      lines.push('---');
      lines.push('FPS: <span class="' + (frameCount > 0 ? 'debug-ok' : 'debug-warn') + '">' + frameCount + '</span>');
      if (extra) lines.push('<span class="debug-info">' + extra + '</span>');
      debugPanel.innerHTML = lines.join('<br>');
      frameCount = 0;
    }

    setInterval(function() { updateDebug(); }, 1000);

    /*
     * METHOD 1: captureStream + MediaRecorder → MJPEG-like
     * Captures the video stream and converts frames to blobs
     * using MediaRecorder with image/webp codec
     */
    function tryMethod1_CaptureStream() {
      methodStatus['M1:captureStream'] = 'TRYING';
      try {
        var stream = hiddenVideo.captureStream ? hiddenVideo.captureStream() :
                     hiddenVideo.mozCaptureStream ? hiddenVideo.mozCaptureStream() : null;
        if (!stream) {
          methodStatus['M1:captureStream'] = 'NOT SUPPORTED';
          return false;
        }

        var track = stream.getVideoTracks()[0];
        if (!track) {
          methodStatus['M1:captureStream'] = 'NO VIDEO TRACK';
          return false;
        }

        // Use ImageCapture API to grab frames
        if (typeof ImageCapture !== 'undefined') {
          var imageCapture = new ImageCapture(track);
          activeMethod = 'M1:ImageCapture';

          function grabFrame() {
            imageCapture.grabFrame().then(function(bitmap) {
              // Draw bitmap to a temp canvas, then to img
              var tempCanvas = document.createElement('canvas');
              tempCanvas.width = bitmap.width;
              tempCanvas.height = bitmap.height;
              var ctx = tempCanvas.getContext('2d');
              ctx.drawImage(bitmap, 0, 0);
              bitmap.close();

              tempCanvas.toBlob(function(blob) {
                if (blob && blob.size > 5000) {
                  methodStatus['M1:captureStream'] = 'OK';
                  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                  currentBlobUrl = URL.createObjectURL(blob);
                  displayImg.src = currentBlobUrl;
                  displayImg.style.display = 'block';
                  renderCanvas.style.display = 'none';
                  frameCount++;
                } else {
                  methodStatus['M1:captureStream'] = 'EMPTY FRAME';
                }
                frameLoopId = requestAnimationFrame(grabFrame);
              }, 'image/jpeg', 0.85);
            }).catch(function(e) {
              methodStatus['M1:captureStream'] = 'BLOCKED: ' + e.message;
              // Fallback to next method
              stopFrameCapture();
              tryMethod2_VideoFrameCallback();
            });
          }
          frameLoopId = requestAnimationFrame(grabFrame);
          return true;
        }

        methodStatus['M1:captureStream'] = 'NO ImageCapture';
        return false;
      } catch(e) {
        methodStatus['M1:captureStream'] = 'ERROR: ' + e.message;
        return false;
      }
    }

    /*
     * METHOD 2: requestVideoFrameCallback
     * Uses the newer requestVideoFrameCallback API to get notified
     * when a new frame is available, then tries to read it
     */
    function tryMethod2_VideoFrameCallback() {
      methodStatus['M2:videoFrameCB'] = 'TRYING';
      if (!hiddenVideo.requestVideoFrameCallback) {
        methodStatus['M2:videoFrameCB'] = 'NOT SUPPORTED';
        tryMethod3_WebCodecsDirect();
        return false;
      }

      activeMethod = 'M2:videoFrameCallback';
      var tempCanvas = document.createElement('canvas');
      var ctx = tempCanvas.getContext('2d');

      function onFrame(now, metadata) {
        tempCanvas.width = metadata.width;
        tempCanvas.height = metadata.height;

        try {
          ctx.drawImage(hiddenVideo, 0, 0);
          var pixel = ctx.getImageData(tempCanvas.width/2, tempCanvas.height/2, 1, 1).data;
          if ((pixel[0] + pixel[1] + pixel[2]) > 0) {
            methodStatus['M2:videoFrameCB'] = 'OK';
            tempCanvas.toBlob(function(blob) {
              if (blob) {
                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = URL.createObjectURL(blob);
                displayImg.src = currentBlobUrl;
                displayImg.style.display = 'block';
                renderCanvas.style.display = 'none';
                frameCount++;
              }
              hiddenVideo.requestVideoFrameCallback(onFrame);
            }, 'image/jpeg', 0.85);
            return;
          }
        } catch(e) {}

        methodStatus['M2:videoFrameCB'] = 'BLOCKED';
        // Fallback
        tryMethod3_WebCodecsDirect();
      }

      hiddenVideo.requestVideoFrameCallback(onFrame);
      return true;
    }

    /*
     * METHOD 3: WebCodecs VideoDecoder
     * Decode H.264 frames directly using WebCodecs API
     * completely bypassing the <video> element for rendering
     */
    function tryMethod3_WebCodecsDirect() {
      methodStatus['M3:WebCodecs'] = 'TRYING';

      if (typeof VideoDecoder === 'undefined') {
        methodStatus['M3:WebCodecs'] = 'NOT SUPPORTED';
        tryMethod4_OffscreenCanvas();
        return false;
      }

      activeMethod = 'M3:WebCodecs';

      // We need to intercept the HLS segments and decode them ourselves
      // This is complex but the only way to bypass the video element entirely
      if (!currentHls) {
        methodStatus['M3:WebCodecs'] = 'NO HLS';
        tryMethod4_OffscreenCanvas();
        return false;
      }

      var ctx = renderCanvas.getContext('2d');
      var decoder = new VideoDecoder({
        output: function(frame) {
          renderCanvas.width = frame.displayWidth;
          renderCanvas.height = frame.displayHeight;
          ctx.drawImage(frame, 0, 0);
          frame.close();

          // Convert canvas to img
          renderCanvas.toBlob(function(blob) {
            if (blob && blob.size > 1000) {
              methodStatus['M3:WebCodecs'] = 'OK';
              if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
              currentBlobUrl = URL.createObjectURL(blob);
              displayImg.src = currentBlobUrl;
              displayImg.style.display = 'block';
              renderCanvas.style.display = 'none';
              frameCount++;
            }
          }, 'image/jpeg', 0.85);
        },
        error: function(e) {
          methodStatus['M3:WebCodecs'] = 'DECODE ERROR: ' + e.message;
        }
      });

      // Hook into HLS.js fragment loading to get raw H.264 data
      currentHls.on(Hls.Events.FRAG_PARSING_DATA, function(event, data) {
        if (data.type === 'video') {
          try {
            for (var i = 0; i < data.nb; i++) {
              var sample = data.samples[i];
              if (sample && sample.data) {
                var chunkType = sample.key ? 'key' : 'delta';

                if (decoder.state === 'unconfigured') {
                  // Try to configure from HLS level info
                  var level = currentHls.levels[currentHls.currentLevel];
                  if (level) {
                    decoder.configure({
                      codec: 'avc1.4d401e',
                      codedWidth: level.width || 1024,
                      codedHeight: level.height || 576,
                      optimizeForLatency: true,
                      hardwareAcceleration: 'prefer-hardware'
                    });
                  }
                }

                if (decoder.state === 'configured') {
                  var chunk = new EncodedVideoChunk({
                    type: chunkType,
                    timestamp: sample.pts * 1000,
                    duration: sample.duration * 1000,
                    data: sample.data
                  });
                  decoder.decode(chunk);
                }
              }
            }
          } catch(e) {
            methodStatus['M3:WebCodecs'] = 'ERROR: ' + e.message;
          }
        }
      });

      methodStatus['M3:WebCodecs'] = 'WAITING FOR DATA';
      return true;
    }

    /*
     * METHOD 4: OffscreenCanvas in Worker
     * Move canvas operations to a Web Worker where Tesla might not block them
     */
    function tryMethod4_OffscreenCanvas() {
      methodStatus['M4:OffscreenCanvas'] = 'TRYING';

      if (typeof OffscreenCanvas === 'undefined') {
        methodStatus['M4:OffscreenCanvas'] = 'NOT SUPPORTED';
        tryMethod5_CreateImageBitmap();
        return false;
      }

      activeMethod = 'M4:OffscreenCanvas';

      try {
        var offscreen = new OffscreenCanvas(1024, 576);
        var ctx = offscreen.getContext('2d');

        function renderFrame() {
          try {
            if (hiddenVideo.readyState >= 2 && hiddenVideo.videoWidth > 0) {
              offscreen.width = hiddenVideo.videoWidth;
              offscreen.height = hiddenVideo.videoHeight;
              ctx.drawImage(hiddenVideo, 0, 0);

              offscreen.convertToBlob({ type: 'image/jpeg', quality: 0.85 }).then(function(blob) {
                if (blob && blob.size > 5000) {
                  methodStatus['M4:OffscreenCanvas'] = 'OK';
                  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                  currentBlobUrl = URL.createObjectURL(blob);
                  displayImg.src = currentBlobUrl;
                  displayImg.style.display = 'block';
                  renderCanvas.style.display = 'none';
                  frameCount++;
                } else {
                  methodStatus['M4:OffscreenCanvas'] = 'EMPTY FRAME';
                  tryMethod5_CreateImageBitmap();
                  return;
                }
                frameLoopId = requestAnimationFrame(renderFrame);
              }).catch(function(e) {
                methodStatus['M4:OffscreenCanvas'] = 'BLOCKED: ' + e.message;
                tryMethod5_CreateImageBitmap();
              });
            } else {
              frameLoopId = requestAnimationFrame(renderFrame);
            }
          } catch(e) {
            methodStatus['M4:OffscreenCanvas'] = 'ERROR: ' + e.message;
            tryMethod5_CreateImageBitmap();
          }
        }

        frameLoopId = requestAnimationFrame(renderFrame);
        return true;
      } catch(e) {
        methodStatus['M4:OffscreenCanvas'] = 'ERROR: ' + e.message;
        tryMethod5_CreateImageBitmap();
        return false;
      }
    }

    /*
     * METHOD 5: createImageBitmap from video
     * Alternative way to extract frames without drawImage
     */
    function tryMethod5_CreateImageBitmap() {
      methodStatus['M5:createImageBitmap'] = 'TRYING';

      if (typeof createImageBitmap === 'undefined') {
        methodStatus['M5:createImageBitmap'] = 'NOT SUPPORTED';
        methodStatus['ALL'] = 'EXHAUSTED';
        return false;
      }

      activeMethod = 'M5:createImageBitmap';
      var tempCanvas = document.createElement('canvas');
      var ctx = tempCanvas.getContext('2d');

      function renderFrame() {
        if (hiddenVideo.readyState >= 2 && hiddenVideo.videoWidth > 0) {
          createImageBitmap(hiddenVideo).then(function(bitmap) {
            tempCanvas.width = bitmap.width;
            tempCanvas.height = bitmap.height;
            ctx.drawImage(bitmap, 0, 0);
            bitmap.close();

            var pixel = ctx.getImageData(tempCanvas.width/2, tempCanvas.height/2, 1, 1).data;
            if ((pixel[0] + pixel[1] + pixel[2]) > 0) {
              methodStatus['M5:createImageBitmap'] = 'OK';
              tempCanvas.toBlob(function(blob) {
                if (blob) {
                  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                  currentBlobUrl = URL.createObjectURL(blob);
                  displayImg.src = currentBlobUrl;
                  displayImg.style.display = 'block';
                  renderCanvas.style.display = 'none';
                  frameCount++;
                }
                frameLoopId = requestAnimationFrame(renderFrame);
              }, 'image/jpeg', 0.85);
            } else {
              methodStatus['M5:createImageBitmap'] = 'BLOCKED';
              frameLoopId = requestAnimationFrame(renderFrame);
            }
          }).catch(function(e) {
            methodStatus['M5:createImageBitmap'] = 'BLOCKED: ' + e.message;
            frameLoopId = requestAnimationFrame(renderFrame);
          });
        } else {
          frameLoopId = requestAnimationFrame(renderFrame);
        }
      }

      frameLoopId = requestAnimationFrame(renderFrame);
      return true;
    }

    function stopFrameCapture() {
      if (frameLoopId) {
        cancelAnimationFrame(frameLoopId);
        frameLoopId = null;
      }
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
    }

    function startAllMethods() {
      stopFrameCapture();
      activeMethod = 'starting...';
      methodStatus = {};

      // Try Method 1 first, it will cascade to others if blocked
      if (!tryMethod1_CaptureStream()) {
        if (!tryMethod2_VideoFrameCallback()) {
          // Method 3 and beyond are tried by the cascade
        }
      }

      // Also try Method 3 (WebCodecs) in parallel since it doesn't depend on drawImage
      tryMethod3_WebCodecsDirect();
    }

    function playStream(url) {
      stopFrameCapture();
      if (currentHls) {
        currentHls.destroy();
        currentHls = null;
      }

      hiddenVideo.muted = false;
      activeMethod = 'loading...';
      methodStatus = {};

      if (Hls.isSupported()) {
        var hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(url);
        hls.attachMedia(hiddenVideo);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          hiddenVideo.play().then(function() {
            startAllMethods();
          }).catch(function(e) {
            hiddenVideo.muted = true;
            hiddenVideo.play().then(function() {
              startAllMethods();
              setTimeout(function() { hiddenVideo.muted = false; }, 1000);
            });
          });
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          methodStatus['HLS'] = data.type + ':' + data.details;
        });
        currentHls = hls;
      } else if (hiddenVideo.canPlayType('application/vnd.apple.mpegurl')) {
        hiddenVideo.src = url;
        hiddenVideo.addEventListener('loadedmetadata', function() {
          hiddenVideo.play().then(function() {
            startAllMethods();
          });
        }, { once: true });
      }

      var container = document.getElementById('videoContainer');
      container.innerHTML = '';
      container.appendChild(hiddenVideo);
      container.appendChild(renderCanvas);
      container.appendChild(displayImg);
    }

    function playStreamRaw(url) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url);
      xhr.onload = function() {
        if (xhr.status === 200) { playStream(xhr.responseURL); }
      };
      xhr.send();
    }

    function createButton(name, logo, url, groupTitle) {
      var button = document.createElement('button');
      button.className = 'channel-button';
      button.innerHTML = '<img src="' + logo + '" alt="' + name + '">';
      button.addEventListener('click', function() {
        if (url.includes('php?m3u8')) {
          var iframe = document.createElement('iframe');
          iframe.src = 'https://www.mako.co.il/AjaxPage?jspName=embedHTML5video.jsp&galleryChannelId=7c5076a9b8757810VgnVCM100000700a10acRCRD&videoChannelId=d1d6f5dfc8517810VgnVCM100000700a10acRCRD&vcmid=1e2258089b67f510VgnVCM2000002a0c10acRCRD';
          iframe.setAttribute('allowfullscreen', true);
          var container = document.getElementById('videoContainer');
          container.innerHTML = '';
          container.appendChild(iframe);
        } else {
          playStream(url);
        }
      });
      return button;
    }

    function start() {
      fetch('https://raw.githubusercontent.com/soulnous/mybabe/main/lol1.m3u')
        .then(function(response) { return response.text(); })
        .then(function(data) {
          var channelPicker = document.getElementById('channelPicker');
          channelPicker.innerHTML = '';
          var lines = data.split(/\r?\n/);
          var channels = [];
          var currentChannel = {};

          lines.forEach(function(line) {
            if (line.startsWith('#EXTINF:-1')) {
              if (currentChannel.name && currentChannel.logo && currentChannel.url) {
                channels.push(currentChannel);
                currentChannel = {};
              }
              var nameMatch = line.match(/tvg-id="([^"]+)"/);
              var logoMatch = line.match(/tvg-logo="([^"]+)"/);
              var groupTitleMatch = line.match(/group-title="([^"]+)"/);
              if (nameMatch && logoMatch) {
                currentChannel.name = nameMatch[1];
                currentChannel.logo = logoMatch[1];
                currentChannel.groupTitle = groupTitleMatch ? groupTitleMatch[1] : '';
              }
            } else if (line.trim() !== '' && !line.startsWith('#')) {
              currentChannel.url = line;
            }
          });

          if (currentChannel.name && currentChannel.logo && currentChannel.url) {
            channels.push(currentChannel);
          }

          channels.forEach(function(channel) {
            var button = createButton(channel.name, channel.logo, channel.url, channel.groupTitle);
            channelPicker.appendChild(button);
          });
        });
    }

    window.onload = function() { start(); };
  </script>
</body>
</html>
