<!DOCTYPE html>
<html>
<head>
  <title>OpenMyCarIL - Tesla TV Player v4</title>
  <link rel="icon" href="https://images.shulcloud.com/1105/uploads/OTT/vbstv-square-icon-512.jpg" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      position: relative;
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      display: flex;
    }
    #supportButton {
      display: block;
      font-family: tahoma;
      text-align: center;
      padding-bottom: 10px;
    }
    #supportButton a {
      text-decoration: none;
      color: #aaa;
      font-size: 20px;
    }
    #content {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #channelPicker {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100vh;
    }
    #channelPicker button {
      margin: 5px 0;
      cursor: pointer;
    }
    #channelPicker img {
      width: 100px;
      height: auto;
    }
    #videoContainer {
      flex: 1;
      text-align: center;
      position: relative;
    }
    #displayImg {
      width: 95%;
      max-height: 90%;
      margin: 0 auto;
      display: none;
      background: #000;
    }
    #renderCanvas {
      width: 95%;
      max-height: 90%;
      margin: 0 auto;
      display: block;
      background: #000;
    }
    #audioVideo {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
    #videoContainer iframe {
      width: 95%;
      height: 90%;
    }
    #debugPanel {
      position: fixed;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      padding: 8px 12px;
      font-size: 11px;
      font-family: monospace;
      border-radius: 4px;
      z-index: 9999;
      line-height: 1.5;
      min-width: 320px;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }
    .dok { color: #0f0; }
    .dfail { color: #f00; }
    .dwarn { color: #ff0; }
    .dinfo { color: #0ff; }
  </style>
</head>
<body>
  <div id="channelPicker"></div>
  <div id="content">
    <div id="supportButton">
      <a href="https://OpenMyCar-IL.com" target="_blank">
        OpenMyCar-IL.com - FREE ISRAELI&WORLDWIDE TV CHANNELS
      </a>
    </div>
    <div id="videoContainer">
      <video id="audioVideo" playsinline></video>
      <canvas id="renderCanvas"></canvas>
      <img id="displayImg" alt="TV Stream" />
    </div>
  </div>
  <div id="debugPanel">Loading...</div>

  <script>
    /**
     * Tesla TV Player v4 - Fixed
     *
     * Strategy:
     * - Use HLS.js ONLY for audio (attached to hidden video)
     * - Use HLS.js custom buffer controller to intercept remuxed MP4 video data
     * - Use WebCodecs to decode the video independently
     * - Render VideoFrame to canvas (bypasses Tesla's video element block)
     *
     * Key insight: HLS.js transmuxes TS->MP4 internally. We intercept
     * the MP4 video data BEFORE it goes to MSE, and feed it to WebCodecs.
     */

    var currentHls = null;
    var videoDecoder = null;
    var frameCount = 0;
    var decodedTotal = 0;
    var currentBlobUrl = null;
    var canvasMode = true; // true=canvas, false=img fallback
    var debugInfo = {};
    var initSegmentData = null;
    var codecString = null;
    var videoWidth = 0;
    var videoHeight = 0;

    var audioVideo = document.getElementById('audioVideo');
    var renderCanvas = document.getElementById('renderCanvas');
    var displayImg = document.getElementById('displayImg');
    var debugPanel = document.getElementById('debugPanel');
    var ctx = renderCanvas.getContext('2d');

    function dbg(k, v, s) {
      debugInfo[k] = '<span class="d' + (s||'info') + '">' + v + '</span>';
    }

    setInterval(function() {
      dbg('FPS', frameCount, frameCount > 0 ? 'ok' : 'warn');
      var html = '<b>=== TESLA v4 Fixed ===</b><br>';
      for (var k in debugInfo) html += k + ': ' + debugInfo[k] + '<br>';
      debugPanel.innerHTML = html;
      frameCount = 0;
    }, 1000);

    // ---- WebCodecs Decoder ----

    function onFrame(frame) {
      decodedTotal++;

      if (renderCanvas.width !== frame.displayWidth ||
          renderCanvas.height !== frame.displayHeight) {
        renderCanvas.width = frame.displayWidth;
        renderCanvas.height = frame.displayHeight;
      }

      if (canvasMode) {
        try {
          ctx.drawImage(frame, 0, 0);
          // Quick check if pixels are real
          var px = ctx.getImageData(frame.displayWidth/2, frame.displayHeight/2, 1, 1).data;
          if ((px[0]+px[1]+px[2]) > 10) {
            dbg('Render', 'CANVAS OK', 'ok');
            frameCount++;
          } else {
            dbg('Render', 'BLACK - switching to IMG', 'warn');
            canvasMode = false;
            canvasToImg();
          }
        } catch(e) {
          dbg('Render', 'Canvas error: ' + e.message + ' - switching to IMG', 'fail');
          canvasMode = false;
          canvasToImg();
        }
      } else {
        // IMG fallback mode
        try {
          ctx.drawImage(frame, 0, 0);
        } catch(e) {}
        canvasToImg();
      }

      frame.close();
      dbg('Decoded', decodedTotal, 'ok');
    }

    function canvasToImg() {
      renderCanvas.toBlob(function(blob) {
        if (blob && blob.size > 2000) {
          if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = URL.createObjectURL(blob);
          displayImg.src = currentBlobUrl;
          displayImg.style.display = 'block';
          renderCanvas.style.display = 'none';
          frameCount++;
          dbg('Render', 'IMG fallback OK (' + blob.size + 'b)', 'ok');
        }
      }, 'image/jpeg', 0.85);
    }

    function setupDecoder(codec, width, height) {
      if (videoDecoder) {
        try { videoDecoder.close(); } catch(e){}
      }

      if (typeof VideoDecoder === 'undefined') {
        dbg('WebCodecs', 'NOT AVAILABLE', 'fail');
        return false;
      }

      videoDecoder = new VideoDecoder({
        output: onFrame,
        error: function(e) {
          dbg('Decoder error', e.message, 'fail');
        }
      });

      var config = {
        codec: codec || 'avc1.42E01E',
        optimizeForLatency: true,
        hardwareAcceleration: 'prefer-hardware'
      };
      if (width && height) {
        config.codedWidth = width;
        config.codedHeight = height;
      }

      try {
        videoDecoder.configure(config);
        dbg('Decoder', codec + ' ' + (width||'?') + 'x' + (height||'?'), 'ok');
        return true;
      } catch(e) {
        dbg('Decoder config', 'FAILED: ' + e.message, 'fail');
        return false;
      }
    }

    // ---- HLS.js with buffer interception ----

    function playStream(url) {
      cleanup();
      dbg('Status', 'Loading...', 'info');

      if (!Hls.isSupported()) {
        dbg('HLS', 'Not supported', 'fail');
        return;
      }

      var hasWebCodecs = typeof VideoDecoder !== 'undefined';
      dbg('WebCodecs', hasWebCodecs ? 'YES' : 'NO', hasWebCodecs ? 'ok' : 'fail');

      // Create HLS instance
      var hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });

      // Attach to hidden video for audio
      hls.loadSource(url);
      hls.attachMedia(audioVideo);

      hls.on(Hls.Events.MANIFEST_PARSED, function(ev, data) {
        dbg('HLS', 'Manifest OK - ' + data.levels.length + ' levels', 'ok');

        // Get codec and resolution
        if (data.levels.length > 0) {
          var level = data.levels[0];
          videoWidth = level.width || 0;
          videoHeight = level.height || 0;
          dbg('Stream', videoWidth + 'x' + videoHeight, 'info');

          // Extract codec string from level
          if (level.videoCodec) {
            codecString = level.videoCodec;
          } else if (level.attrs && level.attrs.CODECS) {
            var codecs = level.attrs.CODECS.split(',');
            for (var i = 0; i < codecs.length; i++) {
              if (codecs[i].trim().startsWith('avc')) {
                codecString = codecs[i].trim();
                break;
              }
            }
          }
          if (!codecString) codecString = 'avc1.42E01E';
          dbg('Codec', codecString, 'info');

          if (hasWebCodecs) {
            setupDecoder(codecString, videoWidth, videoHeight);
          }
        }

        audioVideo.play().then(function() {
          dbg('Audio', 'PLAYING', 'ok');
        }).catch(function() {
          audioVideo.muted = true;
          audioVideo.play().then(function() {
            dbg('Audio', 'Playing (muted)', 'warn');
            setTimeout(function() { audioVideo.muted = false; }, 2000);
          });
        });
      });

      // Listen for BUFFER_APPENDING to intercept MP4 video segments
      hls.on(Hls.Events.BUFFER_APPENDING, function(ev, data) {
        if (data.type === 'video' && hasWebCodecs && videoDecoder &&
            videoDecoder.state === 'configured') {

          var buf = data.data;
          dbg('Buffer', data.type + ' ' + buf.byteLength + 'b', 'ok');

          // Parse the fMP4 to find moof+mdat boxes and extract video samples
          try {
            parseFMP4AndDecode(buf);
          } catch(e) {
            dbg('Parse error', e.message, 'fail');
          }
        }
      });

      // Also try FRAG_PARSING_DATA
      hls.on(Hls.Events.FRAG_PARSING_DATA, function(ev, data) {
        if (data.type === 'video' && hasWebCodecs && videoDecoder) {
          dbg('FragData', data.nb + ' samples', 'ok');

          if (videoDecoder.state !== 'configured' && videoWidth > 0) {
            setupDecoder(codecString, videoWidth, videoHeight);
          }

          if (videoDecoder.state === 'configured' && data.samples) {
            for (var i = 0; i < data.nb; i++) {
              var s = data.samples[i];
              if (!s) continue;

              var sampleData = null;
              if (s.units && s.units.length > 0) {
                // Combine NAL units
                var total = 0;
                for (var j = 0; j < s.units.length; j++) {
                  total += s.units[j].data.byteLength;
                }
                var combined = new Uint8Array(total);
                var off = 0;
                for (var j = 0; j < s.units.length; j++) {
                  combined.set(new Uint8Array(s.units[j].data), off);
                  off += s.units[j].data.byteLength;
                }
                sampleData = combined;
              } else if (s.data) {
                sampleData = s.data;
              }

              if (sampleData && videoDecoder.decodeQueueSize < 5) {
                try {
                  videoDecoder.decode(new EncodedVideoChunk({
                    type: s.key ? 'key' : 'delta',
                    timestamp: (s.pts || 0) * 1000,
                    duration: (s.duration || 33) * 1000,
                    data: sampleData
                  }));
                } catch(e) {
                  dbg('Decode err', e.message, 'fail');
                }
              }
            }
          }
        }
      });

      hls.on(Hls.Events.LEVEL_SWITCHED, function(ev, data) {
        var level = hls.levels[data.level];
        if (level) {
          videoWidth = level.width || videoWidth;
          videoHeight = level.height || videoHeight;
          codecString = level.videoCodec || codecString || 'avc1.42E01E';
          dbg('Quality', videoWidth + 'x' + videoHeight, 'info');
        }
      });

      hls.on(Hls.Events.ERROR, function(ev, data) {
        dbg('HLS err', data.details, 'fail');
        if (data.fatal && data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        }
      });

      currentHls = hls;

      var c = document.getElementById('videoContainer');
      c.innerHTML = '';
      c.appendChild(audioVideo);
      c.appendChild(renderCanvas);
      c.appendChild(displayImg);
    }

    // Simple fMP4 parser to extract video samples
    function parseFMP4AndDecode(buffer) {
      var view = new DataView(buffer.buffer || buffer);
      var offset = 0;

      while (offset < buffer.byteLength - 8) {
        var size = view.getUint32(offset);
        var type = String.fromCharCode(
          view.getUint8(offset+4), view.getUint8(offset+5),
          view.getUint8(offset+6), view.getUint8(offset+7)
        );

        if (size < 8 || offset + size > buffer.byteLength) break;

        if (type === 'mdat') {
          // mdat contains the raw video data
          var mdatData = buffer.slice(offset + 8, offset + size);
          if (mdatData.byteLength > 100 && videoDecoder &&
              videoDecoder.state === 'configured' &&
              videoDecoder.decodeQueueSize < 5) {

            // Check if this looks like a keyframe (starts with SPS/PPS NALs)
            var firstByte = mdatData[4] & 0x1F; // NAL type
            var isKey = (firstByte === 5 || firstByte === 7); // IDR or SPS

            try {
              videoDecoder.decode(new EncodedVideoChunk({
                type: isKey ? 'key' : 'delta',
                timestamp: Date.now() * 1000,
                data: mdatData
              }));
              dbg('mdat decode', mdatData.byteLength + 'b ' + (isKey?'KEY':'delta'), 'ok');
            } catch(e) {
              dbg('mdat err', e.message, 'fail');
            }
          }
        }

        offset += size;
      }
    }

    function cleanup() {
      if (currentHls) { currentHls.destroy(); currentHls = null; }
      if (videoDecoder) { try { videoDecoder.close(); } catch(e){} videoDecoder = null; }
      if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
      decodedTotal = 0;
      frameCount = 0;
      canvasMode = true;
      debugInfo = {};
      renderCanvas.style.display = 'block';
      displayImg.style.display = 'none';
    }

    // ---- UI ----

    function createButton(name, logo, url, groupTitle) {
      var button = document.createElement('button');
      button.className = 'channel-button';
      button.innerHTML = '<img src="' + logo + '" alt="' + name + '">';
      button.addEventListener('click', function() {
        if (url.includes('php?m3u8')) {
          var iframe = document.createElement('iframe');
          iframe.src = 'https://www.mako.co.il/AjaxPage?jspName=embedHTML5video.jsp&galleryChannelId=7c5076a9b8757810VgnVCM100000700a10acRCRD&videoChannelId=d1d6f5dfc8517810VgnVCM100000700a10acRCRD&vcmid=1e2258089b67f510VgnVCM2000002a0c10acRCRD';
          iframe.setAttribute('allowfullscreen', true);
          var c = document.getElementById('videoContainer');
          c.innerHTML = '';
          c.appendChild(iframe);
        } else {
          playStream(url);
        }
      });
      return button;
    }

    function start() {
      dbg('VideoDecoder', typeof VideoDecoder !== 'undefined' ? 'YES':'NO',
          typeof VideoDecoder !== 'undefined' ? 'ok':'fail');

      fetch('https://raw.githubusercontent.com/soulnous/mybabe/main/lol1.m3u')
        .then(function(r) { return r.text(); })
        .then(function(data) {
          var picker = document.getElementById('channelPicker');
          picker.innerHTML = '';
          var lines = data.split(/\r?\n/);
          var channels = [];
          var cur = {};

          lines.forEach(function(line) {
            if (line.startsWith('#EXTINF:-1')) {
              if (cur.name && cur.logo && cur.url) {
                channels.push(cur);
                cur = {};
              }
              var n = line.match(/tvg-id="([^"]+)"/);
              var l = line.match(/tvg-logo="([^"]+)"/);
              var g = line.match(/group-title="([^"]+)"/);
              if (n && l) {
                cur.name = n[1];
                cur.logo = l[1];
                cur.groupTitle = g ? g[1] : '';
              }
            } else if (line.trim() !== '' && !line.startsWith('#')) {
              cur.url = line;
            }
          });
          if (cur.name && cur.logo && cur.url) channels.push(cur);

          channels.forEach(function(ch) {
            picker.appendChild(createButton(ch.name, ch.logo, ch.url, ch.groupTitle));
          });
        });
    }

    window.onload = function() { start(); };
  </script>
</body>
</html>
