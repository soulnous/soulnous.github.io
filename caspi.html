<!DOCTYPE html>
<html>
<head>
  <title>OpenMyCarIL - Tesla TV Player v2</title>
  <link rel="icon" href="https://images.shulcloud.com/1105/uploads/OTT/vbstv-square-icon-512.jpg" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      position: relative;
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      display: flex;
    }
    #supportButton {
      display: block;
      font-family: tahoma;
      text-align: center;
      padding-bottom: 10px;
    }
    #supportButton a {
      text-decoration: none;
      color: #aaa;
      font-size: 20px;
    }
    #content {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #channelPicker {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100vh;
    }
    #channelPicker button {
      margin: 5px 0;
      cursor: pointer;
    }
    #channelPicker img {
      width: 100px;
      height: auto;
    }
    #videoContainer {
      flex: 1;
      text-align: center;
      position: relative;
    }
    #displayImg {
      width: 95%;
      max-height: 90%;
      margin: 0 auto;
      display: block;
      background: #000;
    }
    #hiddenVideo {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
    #captureCanvas {
      display: none;
    }
    #videoContainer iframe {
      width: 95%;
      height: 90%;
    }
    /* Debug panel */
    #debugPanel {
      position: fixed;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      padding: 8px 12px;
      font-size: 12px;
      font-family: monospace;
      border-radius: 4px;
      z-index: 9999;
      line-height: 1.6;
      min-width: 280px;
      text-align: left;
    }
    .debug-ok { color: #0f0; }
    .debug-fail { color: #f00; }
    .debug-warn { color: #ff0; }
  </style>
</head>
<body>
  <div id="channelPicker"></div>
  <div id="content">
    <div id="supportButton">
      <a href="https://OpenMyCar-IL.com" target="_blank">
        OpenMyCar-IL.com - FREE ISRAELI&WORLDWIDE TV CHANNELS
      </a>
    </div>
    <div id="videoContainer">
      <video id="hiddenVideo" playsinline></video>
      <canvas id="captureCanvas"></canvas>
      <img id="displayImg" alt="TV Stream" />
    </div>
  </div>
  <div id="debugPanel">Waiting for channel...</div>

  <script>
    var isPickerVisible = true;
    var currentHls = null;
    var frameLoopId = null;
    var frameCount = 0;
    var lastFpsUpdate = Date.now();
    var currentBlobUrl = null;
    var blobSize = 0;
    var videoReadyState = 0;
    var videoPaused = true;
    var drawImageWorking = false;
    var toBlobWorking = false;
    var imgUpdateWorking = false;
    var lastFrameTime = 0;

    var hiddenVideo = document.getElementById('hiddenVideo');
    var captureCanvas = document.getElementById('captureCanvas');
    var captureCtx = captureCanvas.getContext('2d');
    var displayImg = document.getElementById('displayImg');
    var debugPanel = document.getElementById('debugPanel');

    function updateDebug() {
      var lines = [];
      lines.push('=== TESLA DEBUG v2 ===');
      lines.push('Video readyState: <span class="' + (videoReadyState >= 2 ? 'debug-ok' : 'debug-fail') + '">' + videoReadyState + '/4</span>');
      lines.push('Video paused: <span class="' + (videoPaused ? 'debug-fail' : 'debug-ok') + '">' + videoPaused + '</span>');
      lines.push('Video size: ' + hiddenVideo.videoWidth + 'x' + hiddenVideo.videoHeight);
      lines.push('Video currentTime: ' + (hiddenVideo.currentTime || 0).toFixed(1) + 's');
      lines.push('---');
      lines.push('drawImage: <span class="' + (drawImageWorking ? 'debug-ok' : 'debug-fail') + '">' + (drawImageWorking ? 'OK' : 'BLOCKED') + '</span>');
      lines.push('toBlob: <span class="' + (toBlobWorking ? 'debug-ok' : 'debug-fail') + '">' + (toBlobWorking ? 'OK' : 'BLOCKED') + '</span>');
      lines.push('Blob size: ' + blobSize + ' bytes');
      lines.push('img update: <span class="' + (imgUpdateWorking ? 'debug-ok' : 'debug-fail') + '">' + (imgUpdateWorking ? 'OK' : 'BLOCKED') + '</span>');
      lines.push('---');
      lines.push('FPS: <span class="' + (frameCount > 0 ? 'debug-ok' : 'debug-warn') + '">' + frameCount + '</span>');
      debugPanel.innerHTML = lines.join('<br>');
    }

    // Update debug every second
    setInterval(function() {
      videoReadyState = hiddenVideo.readyState;
      videoPaused = hiddenVideo.paused;
      updateDebug();
      frameCount = 0;
    }, 1000);

    function startFrameCapture() {
      stopFrameCapture();

      function captureFrame() {
        videoReadyState = hiddenVideo.readyState;
        videoPaused = hiddenVideo.paused;

        if (hiddenVideo.readyState >= 2 && hiddenVideo.videoWidth > 0) {
          if (captureCanvas.width !== hiddenVideo.videoWidth ||
              captureCanvas.height !== hiddenVideo.videoHeight) {
            captureCanvas.width = hiddenVideo.videoWidth;
            captureCanvas.height = hiddenVideo.videoHeight;
          }

          // Test 1: Can we drawImage from video?
          try {
            captureCtx.drawImage(hiddenVideo, 0, 0);
            // Check if pixels are non-zero (not black)
            var pixel = captureCtx.getImageData(
              Math.floor(captureCanvas.width / 2),
              Math.floor(captureCanvas.height / 2),
              1, 1
            ).data;
            drawImageWorking = (pixel[0] + pixel[1] + pixel[2]) > 0;
          } catch(e) {
            drawImageWorking = false;
          }

          // Test 2: Can we convert to blob?
          captureCanvas.toBlob(function(blob) {
            if (blob) {
              toBlobWorking = true;
              blobSize = blob.size;

              // Test 3: Can we update img src?
              if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
              }
              currentBlobUrl = URL.createObjectURL(blob);
              displayImg.src = currentBlobUrl;
              imgUpdateWorking = true;

              frameCount++;
            } else {
              toBlobWorking = false;
            }
            frameLoopId = requestAnimationFrame(captureFrame);
          }, 'image/jpeg', 0.85);
        } else {
          // Video not ready - if paused, try to play again
          if (hiddenVideo.paused && hiddenVideo.src) {
            hiddenVideo.play().catch(function(){});
          }
          frameLoopId = requestAnimationFrame(captureFrame);
        }
      }

      frameLoopId = requestAnimationFrame(captureFrame);
    }

    function stopFrameCapture() {
      if (frameLoopId) {
        cancelAnimationFrame(frameLoopId);
        frameLoopId = null;
      }
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
    }

    function playStream(url) {
      stopFrameCapture();
      if (currentHls) {
        currentHls.destroy();
        currentHls = null;
      }

      hiddenVideo.muted = false;

      if (Hls.isSupported()) {
        var hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(url);
        hls.attachMedia(hiddenVideo);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          hiddenVideo.play().then(function() {
            startFrameCapture();
          }).catch(function(e) {
            console.log('Autoplay blocked, trying muted:', e);
            hiddenVideo.muted = true;
            hiddenVideo.play().then(function() {
              startFrameCapture();
              setTimeout(function() {
                hiddenVideo.muted = false;
              }, 1000);
            });
          });
        });

        // Monitor HLS errors
        hls.on(Hls.Events.ERROR, function(event, data) {
          debugPanel.innerHTML += '<br><span class="debug-fail">HLS ERROR: ' + data.type + ' - ' + data.details + '</span>';
        });

        currentHls = hls;
      } else if (hiddenVideo.canPlayType('application/vnd.apple.mpegurl')) {
        hiddenVideo.src = url;
        hiddenVideo.addEventListener('loadedmetadata', function() {
          hiddenVideo.play().then(function() {
            startFrameCapture();
          });
        }, { once: true });
      }

      var container = document.getElementById('videoContainer');
      container.innerHTML = '';
      container.appendChild(hiddenVideo);
      container.appendChild(captureCanvas);
      container.appendChild(displayImg);
    }

    function playStreamRaw(url) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url);
      xhr.onload = function() {
        if (xhr.status === 200) {
          playStream(xhr.responseURL);
        }
      };
      xhr.onerror = function() {
        console.error('Request failed');
      };
      xhr.send();
    }

    function createButton(name, logo, url, groupTitle) {
      var button = document.createElement('button');
      button.className = 'channel-button';
      button.innerHTML = '<img src="' + logo + '" alt="' + name + '">';
      button.addEventListener('click', function() {
        if (url.includes('php?m3u8')) {
          var iframe = document.createElement('iframe');
          iframe.src = 'https://www.mako.co.il/AjaxPage?jspName=embedHTML5video.jsp&galleryChannelId=7c5076a9b8757810VgnVCM100000700a10acRCRD&videoChannelId=d1d6f5dfc8517810VgnVCM100000700a10acRCRD&vcmid=1e2258089b67f510VgnVCM2000002a0c10acRCRD';
          iframe.setAttribute('allowfullscreen', true);
          var container = document.getElementById('videoContainer');
          container.innerHTML = '';
          container.appendChild(iframe);
        } else {
          playStream(url);
        }
      });
      return button;
    }

    function start() {
      fetch('https://raw.githubusercontent.com/soulnous/mybabe/main/lol1.m3u')
        .then(function(response) { return response.text(); })
        .then(function(data) {
          var channelPicker = document.getElementById('channelPicker');
          channelPicker.innerHTML = '';
          var lines = data.split(/\r?\n/);
          var channels = [];
          var currentChannel = {};

          lines.forEach(function(line) {
            if (line.startsWith('#EXTINF:-1')) {
              if (currentChannel.name && currentChannel.logo && currentChannel.url) {
                channels.push(currentChannel);
                currentChannel = {};
              }
              var nameMatch = line.match(/tvg-id="([^"]+)"/);
              var logoMatch = line.match(/tvg-logo="([^"]+)"/);
              var groupTitleMatch = line.match(/group-title="([^"]+)"/);
              if (nameMatch && logoMatch) {
                currentChannel.name = nameMatch[1];
                currentChannel.logo = logoMatch[1];
                currentChannel.groupTitle = groupTitleMatch ? groupTitleMatch[1] : '';
              }
            } else if (line.trim() !== '' && !line.startsWith('#')) {
              currentChannel.url = line;
            }
          });

          if (currentChannel.name && currentChannel.logo && currentChannel.url) {
            channels.push(currentChannel);
          }

          channels.forEach(function(channel) {
            var button = createButton(channel.name, channel.logo, channel.url, channel.groupTitle);
            channelPicker.appendChild(button);
          });
        });
    }

    window.onload = function() {
      start();
    };
  </script>
</body>
</html>
