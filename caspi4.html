<!DOCTYPE html>
<html>
<head>
  <title>OpenMyCarIL - Tesla TV Player v5.4</title>
  <link rel="icon" href="https://images.shulcloud.com/1105/uploads/OTT/vbstv-square-icon-512.jpg" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { margin:0; padding:0; background:#121212; color:#fff; display:flex; }
    #supportButton { display:block; font-family:tahoma; text-align:center; padding-bottom:10px; }
    #supportButton a { text-decoration:none; color:#aaa; font-size:20px; }
    #content { flex:1; height:100vh; display:flex; flex-direction:column; }
    #channelPicker { display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; height:100vh; }
    #channelPicker button { margin:5px 0; cursor:pointer; }
    #channelPicker img { width:100px; height:auto; }
    #videoContainer { flex:1; text-align:center; position:relative; }
    #displayImg { width:95%; max-height:90%; margin:0 auto; display:none; background:#000; }
    #renderCanvas { width:95%; max-height:90%; margin:0 auto; display:block; background:#000; }
    #audioVideo { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; z-index:-1; }
    #videoContainer iframe { width:95%; height:90%; }
    #debugPanel { position:fixed; top:5px; right:5px; background:rgba(0,0,0,0.85); color:#0f0;
      padding:8px 12px; font-size:11px; font-family:monospace; border-radius:4px; z-index:9999;
      line-height:1.5; min-width:280px; text-align:left; max-height:50vh; overflow-y:auto; }
    .dok { color:#0f0; } .dfail { color:#f00; } .dwarn { color:#ff0; } .dinfo { color:#0ff; }
  </style>
</head>
<body>
  <div id="channelPicker"></div>
  <div id="content">
    <div id="supportButton">
      <a href="https://OpenMyCar-IL.com" target="_blank">OpenMyCar-IL.com - FREE ISRAELI&WORLDWIDE TV CHANNELS</a>
    </div>
    <div id="videoContainer">
      <video id="audioVideo" playsinline></video>
      <canvas id="renderCanvas"></canvas>
      <img id="displayImg" alt="TV Stream" />
    </div>
  </div>
  <div id="debugPanel">Loading...</div>

  <script>
    var currentHls = null;
    var videoDecoder = null;
    var frameCount = 0;
    var decodedTotal = 0;
    var errorCount = 0;
    var currentBlobUrl = null;
    var canvasMode = true;
    var debugInfo = {};
    var codecString = 'avc1.42E01E';
    var gotFirstFrame = false;
    var waitingForKeyframe = true;
    var decoderReady = false;
    var avcCData = null;
    var segmentCount = 0;
    var sampleTimestamp = 0;

    var audioVideo = document.getElementById('audioVideo');
    var renderCanvas = document.getElementById('renderCanvas');
    var displayImg = document.getElementById('displayImg');
    var debugPanel = document.getElementById('debugPanel');
    var ctx = renderCanvas.getContext('2d');

    function dbg(k,v,s) { debugInfo[k]='<span class="d'+(s||'info')+'">'+v+'</span>'; }

    setInterval(function() {
      dbg('FPS', frameCount, frameCount > 0 ? 'ok' : 'warn');
      dbg('Audio', (audioVideo.currentTime||0).toFixed(1)+'s / '+(audioVideo.paused?'PAUSED':'playing'), audioVideo.paused?'warn':'ok');
      var html = '<b>=== TESLA v5.4 ===</b><br>';
      for (var k in debugInfo) html += k+': '+debugInfo[k]+'<br>';
      debugPanel.innerHTML = html;
      frameCount = 0;
    }, 1000);

    // ---- fMP4 Box Parser ----
    function readU32(d, o) { return (d[o]<<24)|(d[o+1]<<16)|(d[o+2]<<8)|d[o+3]; }
    function readU16(d, o) { return (d[o]<<8)|d[o+1]; }
    function boxType(d, o) { return String.fromCharCode(d[o],d[o+1],d[o+2],d[o+3]); }

    function findBoxes(data, start, end, type) {
      var results = [];
      var pos = start;
      while (pos + 8 <= end) {
        var size = readU32(data, pos);
        if (size < 8) break;
        if (pos + size > end) break;
        if (boxType(data, pos + 4) === type) {
          results.push({ offset: pos, size: size, headerSize: 8 });
        }
        pos += size;
      }
      return results;
    }

    function findBoxPath(data, start, end, path) {
      var types = path.split('.');
      var searchStart = start;
      var searchEnd = end;
      for (var i = 0; i < types.length; i++) {
        var found = findBoxes(data, searchStart, searchEnd, types[i]);
        if (found.length === 0) return null;
        var box = found[0];
        searchStart = box.offset + box.headerSize;
        searchEnd = box.offset + box.size;
      }
      return { dataStart: searchStart, dataEnd: searchEnd };
    }

    function extractAvcC(initData) {
      var stsd = findBoxPath(initData, 0, initData.byteLength, 'moov.trak.mdia.minf.stbl.stsd');
      if (!stsd) { dbg('Parse', 'No stsd', 'fail'); return null; }
      var entryStart = stsd.dataStart + 8;
      var entryEnd = stsd.dataEnd;
      var avc1 = findBoxes(initData, entryStart, entryEnd, 'avc1');
      if (avc1.length === 0) avc1 = findBoxes(initData, entryStart, entryEnd, 'avc3');
      if (avc1.length === 0) { dbg('Parse', 'No avc1/avc3', 'fail'); return null; }

      var entry = avc1[0];
      var innerEnd = entry.offset + entry.size;
      var w = readU16(initData, entry.offset + entry.headerSize + 24);
      var h = readU16(initData, entry.offset + entry.headerSize + 26);
      if (w > 0 && h > 0) dbg('Resolution', w + 'x' + h, 'ok');

      var innerStart = entry.offset + entry.headerSize + 78;
      var avcCBoxes = findBoxes(initData, innerStart, innerEnd, 'avcC');
      if (avcCBoxes.length === 0) {
        for (var scan = entry.offset + entry.headerSize; scan < innerEnd - 8; scan++) {
          if (initData[scan+4]===0x61 && initData[scan+5]===0x76 &&
              initData[scan+6]===0x63 && initData[scan+7]===0x43) {
            var bSize = readU32(initData, scan);
            if (bSize >= 8 && scan + bSize <= innerEnd) {
              avcCBoxes.push({ offset: scan, size: bSize, headerSize: 8 });
              break;
            }
          }
        }
      }
      if (avcCBoxes.length === 0) { dbg('Parse', 'No avcC!', 'fail'); return null; }

      var avcCBox = avcCBoxes[0];
      var avcCContent = initData.slice(avcCBox.offset + avcCBox.headerSize, avcCBox.offset + avcCBox.size);
      if (avcCContent.length >= 4) {
        var hex = function(v) { return ('0'+v.toString(16)).slice(-2).toUpperCase(); };
        codecString = 'avc1.' + hex(avcCContent[1]) + hex(avcCContent[2]) + hex(avcCContent[3]);
        dbg('Codec', codecString, 'ok');
      }
      dbg('avcC', avcCContent.byteLength + 'b', 'ok');
      return avcCContent;
    }

    function parseTrunBox(data, boxOffset) {
      var pos = boxOffset + 8;
      var version = data[pos]; pos++;
      var flags = (data[pos]<<16)|(data[pos+1]<<8)|data[pos+2]; pos += 3;
      var sampleCount = readU32(data, pos); pos += 4;
      var dataOffsetVal = 0;
      if (!!(flags & 0x1)) { dataOffsetVal = readU32(data, pos); pos += 4; }
      var firstSampleFlags = 0;
      if (!!(flags & 0x4)) { firstSampleFlags = readU32(data, pos); pos += 4; }

      var samples = [];
      for (var i = 0; i < sampleCount; i++) {
        var s = { duration: 0, size: 0, flags: 0 };
        if (!!(flags & 0x100)) { s.duration = readU32(data, pos); pos += 4; }
        if (!!(flags & 0x200)) { s.size = readU32(data, pos); pos += 4; }
        if (!!(flags & 0x400)) { s.flags = readU32(data, pos); pos += 4; }
        else if (i === 0 && !!(flags & 0x4)) { s.flags = firstSampleFlags; }
        if (!!(flags & 0x800)) { pos += 4; }
        samples.push(s);
      }
      return { dataOffset: dataOffsetVal, samples: samples };
    }

    function parseTfdt(data, boxOffset) {
      var pos = boxOffset + 8;
      var version = data[pos];
      return version === 0 ? readU32(data, pos + 4) : readU32(data, pos + 8);
    }

    // ---- A/V Sync tracking ----
    // We track the audio time when each segment's first frame arrives at the decoder.
    // Each frame gets a "target audio time" = the audio time when it should be displayed.
    // The render loop then skips frames whose target time has passed.
    var segAudioTimeAtArrival = 0;  // audio.currentTime when segment was received
    var segFirstFrameTs = 0;        // timestamp of first frame in that segment (microseconds)
    var syncEstablished = false;

    // Process media segment - feed ALL samples to decoder immediately
    function processMediaSegment(data) {
      if (!videoDecoder || videoDecoder.state !== 'configured') return;

      // Capture audio time RIGHT NOW when this segment arrives
      var audioTimeNow = audioVideo.currentTime;

      var moofs = findBoxes(data, 0, data.byteLength, 'moof');
      var mdats = findBoxes(data, 0, data.byteLength, 'mdat');
      if (moofs.length === 0 || mdats.length === 0) return;

      for (var m = 0; m < moofs.length; m++) {
        var moof = moofs[m];
        var mdat = m < mdats.length ? mdats[m] : mdats[mdats.length - 1];

        var trafs = findBoxes(data, moof.offset + 8, moof.offset + moof.size, 'traf');
        if (trafs.length === 0) continue;
        var trafStart = trafs[0].offset + 8;
        var trafEnd = trafs[0].offset + trafs[0].size;

        var tfdts = findBoxes(data, trafStart, trafEnd, 'tfdt');
        var baseTime = sampleTimestamp;
        if (tfdts.length > 0) baseTime = parseTfdt(data, tfdts[0].offset);

        var truns = findBoxes(data, trafStart, trafEnd, 'trun');
        if (truns.length === 0) continue;

        var trun = parseTrunBox(data, truns[0].offset);
        var samplePos = trun.dataOffset ? moof.offset + trun.dataOffset : mdat.offset + mdat.headerSize;
        var ts = baseTime;
        var decoded = 0;
        var isFirstInSeg = true;

        for (var i = 0; i < trun.samples.length; i++) {
          var sample = trun.samples[i];
          if (sample.size <= 0 || samplePos + sample.size > data.byteLength) continue;

          var sampleData = data.slice(samplePos, samplePos + sample.size);
          samplePos += sample.size;

          var isKey = false;
          var nalPos = 0;
          while (nalPos + 4 < sample.size) {
            var nalLen = readU32(sampleData, nalPos);
            if (nalLen <= 0 || nalPos + 4 + nalLen > sample.size) break;
            var nt = sampleData[nalPos + 4] & 0x1F;
            if (nt === 5 || nt === 7) isKey = true;
            nalPos += 4 + nalLen;
          }
          if (i === 0 && !isKey && sample.size > 50000) isKey = true;
          if (waitingForKeyframe && !isKey) continue;

          var frameTs = ts * (1000000 / 90000);

          // Record sync point: first frame of this segment maps to current audio time
          if (isFirstInSeg) {
            segAudioTimeAtArrival = audioTimeNow;
            segFirstFrameTs = frameTs;
            syncEstablished = true;
            isFirstInSeg = false;
          }

          try {
            videoDecoder.decode(new EncodedVideoChunk({
              type: isKey ? 'key' : 'delta',
              timestamp: frameTs,
              duration: (sample.duration || 3000) * (1000000 / 90000),
              data: sampleData
            }));
            decoded++;
            if (isKey && waitingForKeyframe) {
              waitingForKeyframe = false;
              dbg('Keyframe', 'FOUND', 'ok');
            }
          } catch(e) {
            errorCount++;
            dbg('DecErr', e.message, 'fail');
          }
          ts += sample.duration || 3000;
        }

        sampleTimestamp = ts;
        if (trun.samples.length > 0 && trun.samples[0].duration > 0) {
          frameIntervalMs = Math.round(trun.samples[0].duration / 90);
        }
        dbg('Samples', decoded + '/' + trun.samples.length, decoded>0?'ok':'warn');
      }
      segmentCount++;
      dbg('Segments', segmentCount, 'ok');
    }

    // ---- Frame Queue & Audio-Synced Rendering ----
    var frameQueue = [];
    var MAX_QUEUE = 300;
    var renderLoopRunning = false;
    var canvasChecked = false;
    var frameIntervalMs = 40;
    var droppedFrames = 0;

    function onFrame(frame) {
      decodedTotal++;
      if (!gotFirstFrame) {
        gotFirstFrame = true;
        dbg('FirstFrame', frame.displayWidth + 'x' + frame.displayHeight, 'ok');
        renderCanvas.width = frame.displayWidth;
        renderCanvas.height = frame.displayHeight;
      }

      if (frameQueue.length >= MAX_QUEUE) {
        frameQueue.shift().close();
      }
      frameQueue.push(frame);

      if (!renderLoopRunning) {
        renderLoopRunning = true;
        scheduleRender();
      }
    }

    function scheduleRender() {
      setTimeout(renderLoop, frameIntervalMs);
    }

    // Compute the "target audio time" for a given frame based on sync mapping
    function frameTargetAudioTime(frameTs) {
      // frameTs is in microseconds, segFirstFrameTs in microseconds, segAudioTimeAtArrival in seconds
      var offsetSec = (frameTs - segFirstFrameTs) / 1000000;
      return segAudioTimeAtArrival + offsetSec;
    }

    function renderLoop() {
      if (frameQueue.length === 0) {
        renderLoopRunning = false;
        return;
      }

      var now = audioVideo.currentTime;

      // If sync is established, skip frames that are too old (their target time has passed)
      // This prevents the delay from accumulating
      if (syncEstablished && frameQueue.length > 1) {
        var skipped = 0;
        while (frameQueue.length > 1) {
          var nextFrame = frameQueue[1]; // peek at the NEXT frame
          var nextTarget = frameTargetAudioTime(nextFrame.timestamp);
          // If the next frame's target time has already passed, we can skip the current one
          if (nextTarget <= now) {
            var old = frameQueue.shift();
            old.close();
            skipped++;
            droppedFrames++;
          } else {
            break;
          }
        }
        if (skipped > 0) {
          dbg('Skip', droppedFrames + ' total (' + skipped + ' now)', 'warn');
        }
      }

      var frameToRender = frameQueue.shift();

      if (frameToRender) {
        if (renderCanvas.width !== frameToRender.displayWidth ||
            renderCanvas.height !== frameToRender.displayHeight) {
          renderCanvas.width = frameToRender.displayWidth;
          renderCanvas.height = frameToRender.displayHeight;
        }

        if (canvasMode) {
          try {
            ctx.drawImage(frameToRender, 0, 0);
            if (!canvasChecked) {
              var px = ctx.getImageData(
                Math.floor(frameToRender.displayWidth / 2),
                Math.floor(frameToRender.displayHeight / 2), 1, 1
              ).data;
              if ((px[0] + px[1] + px[2]) > 10) {
                canvasChecked = true;
                dbg('Render', 'CANVAS OK', 'ok');
              } else if (decodedTotal > 5) {
                canvasMode = false;
                dbg('Render', 'CANVAS BLACK -> IMG', 'warn');
              }
            }
            frameCount++;
          } catch(e) {
            canvasMode = false;
            dbg('Render', 'ERR -> IMG: ' + e.message, 'fail');
          }
        }

        if (!canvasMode) {
          try { ctx.drawImage(frameToRender, 0, 0); } catch(e) {}
          renderCanvas.toBlob(function(blob) {
            if (blob && blob.size > 500) {
              if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
              currentBlobUrl = URL.createObjectURL(blob);
              displayImg.src = currentBlobUrl;
              displayImg.style.display = 'block';
              renderCanvas.style.display = 'none';
              frameCount++;
            }
          }, 'image/jpeg', 0.85);
        }

        frameToRender.close();
      }

      var syncInfo = '';
      if (syncEstablished && frameQueue.length > 0) {
        var frontTarget = frameTargetAudioTime(frameQueue[0].timestamp);
        var drift = (frontTarget - now).toFixed(2);
        syncInfo = ' drift=' + drift + 's';
      }
      dbg('Q', frameQueue.length + ' int=' + frameIntervalMs + 'ms' + syncInfo, 'info');
      scheduleRender();
    }

    function setupDecoder(codec, description) {
      if (videoDecoder) { try { videoDecoder.close(); } catch(e) {} }
      if (typeof VideoDecoder === 'undefined') {
        dbg('WebCodecs', 'NOT AVAILABLE', 'fail');
        return false;
      }
      videoDecoder = new VideoDecoder({
        output: onFrame,
        error: function(e) { errorCount++; dbg('Dec error', e.message, 'fail'); }
      });
      var config = {
        codec: codec || 'avc1.42E01E',
        optimizeForLatency: true,
        hardwareAcceleration: 'prefer-hardware'
      };
      if (description && description.byteLength > 0) {
        config.description = description;
        dbg('Config', codec + ' + avcC(' + description.byteLength + 'b)', 'ok');
      }
      try {
        videoDecoder.configure(config);
        decoderReady = true;
        dbg('Decoder', 'CONFIGURED: ' + codec, 'ok');
        return true;
      } catch(e) {
        dbg('Decoder', 'CONFIG FAIL: ' + e.message, 'fail');
        return false;
      }
    }

    // ---- HLS.js ----
    function playStream(url) {
      cleanup();
      dbg('Status', 'Loading...', 'info');
      var hasWC = typeof VideoDecoder !== 'undefined';
      dbg('WebCodecs', hasWC ? 'YES' : 'NO', hasWC ? 'ok' : 'fail');
      if (!Hls.isSupported()) { dbg('HLS', 'Not supported', 'fail'); return; }

      var hls = new Hls({ enableWorker: false, lowLatencyMode: true });
      hls.loadSource(url);
      hls.attachMedia(audioVideo);

      hls.on(Hls.Events.MANIFEST_PARSED, function(ev, data) {
        dbg('HLS', data.levels.length + ' levels', 'ok');
        if (data.levels.length > 0 && data.levels[0].videoCodec)
          codecString = data.levels[0].videoCodec.trim();
        audioVideo.play().then(function() {
          dbg('Audio', 'PLAYING', 'ok');
        }).catch(function() {
          audioVideo.muted = true;
          audioVideo.play().then(function() {
            setTimeout(function() { audioVideo.muted = false; }, 2000);
          });
        });
      });

      hls.on(Hls.Events.BUFFER_CODECS, function(ev, data) {
        if (data.video && data.video.initSegment && hasWC) {
          dbg('InitSeg', data.video.initSegment.byteLength + 'b', 'ok');
          avcCData = extractAvcC(data.video.initSegment);
          setupDecoder(data.video.codec || codecString, avcCData);
        }
      });

      hls.on(Hls.Events.BUFFER_APPENDING, function(ev, data) {
        if (data.type !== 'video' || !hasWC) return;
        var buf = data.data instanceof Uint8Array ? data.data : new Uint8Array(data.data);
        var moovCheck = findBoxes(buf, 0, buf.byteLength, 'moov');
        if (moovCheck.length > 0) {
          var newAvcC = extractAvcC(buf);
          if (newAvcC) { avcCData = newAvcC; setupDecoder(codecString, avcCData); }
        }
        if (findBoxes(buf, 0, buf.byteLength, 'moof').length > 0 && decoderReady) {
          processMediaSegment(buf);
        }
      });

      hls.on(Hls.Events.LEVEL_SWITCHED, function(ev, data) {
        var lv = hls.levels[data.level];
        if (lv) {
          dbg('Quality', (lv.width||'?') + 'x' + (lv.height||'?') + ' L' + data.level, 'info');
          waitingForKeyframe = true;
          sampleTimestamp = 0;
          syncEstablished = false;
        }
      });

      hls.on(Hls.Events.ERROR, function(ev, data) {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) setTimeout(function() { hls.startLoad(); }, 3000);
        }
      });

      currentHls = hls;
      var c = document.getElementById('videoContainer');
      c.innerHTML = '';
      c.appendChild(audioVideo);
      c.appendChild(renderCanvas);
      c.appendChild(displayImg);
    }

    function cleanup() {
      if (currentHls) { currentHls.destroy(); currentHls = null; }
      if (videoDecoder) { try { videoDecoder.close(); } catch(e) {} videoDecoder = null; }
      if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
      while (frameQueue.length > 0) { frameQueue.shift().close(); }
      renderLoopRunning = false; canvasChecked = false;
      decodedTotal = 0; frameCount = 0; errorCount = 0; canvasMode = true; debugInfo = {};
      gotFirstFrame = false; waitingForKeyframe = true; decoderReady = false;
      avcCData = null; segmentCount = 0; sampleTimestamp = 0;
      syncEstablished = false; droppedFrames = 0;
      segAudioTimeAtArrival = 0; segFirstFrameTs = 0;
      renderCanvas.style.display = 'block'; displayImg.style.display = 'none';
    }

    function createButton(name, logo, url, groupTitle) {
      var button = document.createElement('button');
      button.className = 'channel-button';
      button.innerHTML = '<img src="' + logo + '" alt="' + name + '">';
      button.addEventListener('click', function() {
        if (url.includes('php?m3u8')) {
          var iframe = document.createElement('iframe');
          iframe.src = 'https://www.mako.co.il/AjaxPage?jspName=embedHTML5video.jsp&galleryChannelId=7c5076a9b8757810VgnVCM100000700a10acRCRD&videoChannelId=d1d6f5dfc8517810VgnVCM100000700a10acRCRD&vcmid=1e2258089b67f510VgnVCM2000002a0c10acRCRD';
          iframe.setAttribute('allowfullscreen', true);
          var c = document.getElementById('videoContainer');
          c.innerHTML = ''; c.appendChild(iframe);
        } else { playStream(url); }
      });
      return button;
    }

    function start() {
      dbg('WebCodecs', typeof VideoDecoder !== 'undefined' ? 'YES' : 'NO', typeof VideoDecoder !== 'undefined' ? 'ok' : 'fail');
      fetch('https://raw.githubusercontent.com/soulnous/mybabe/main/lol1.m3u')
        .then(function(r) { return r.text(); })
        .then(function(data) {
          var picker = document.getElementById('channelPicker');
          picker.innerHTML = '';
          var lines = data.split(/\r?\n/);
          var channels = []; var cur = {};
          lines.forEach(function(line) {
            if (line.startsWith('#EXTINF:-1')) {
              if (cur.name && cur.logo && cur.url) { channels.push(cur); cur = {}; }
              var n = line.match(/tvg-id="([^"]+)"/);
              var l = line.match(/tvg-logo="([^"]+)"/);
              var g = line.match(/group-title="([^"]+)"/);
              if (n && l) { cur.name = n[1]; cur.logo = l[1]; cur.groupTitle = g ? g[1] : ''; }
            } else if (line.trim() !== '' && !line.startsWith('#')) { cur.url = line; }
          });
          if (cur.name && cur.logo && cur.url) channels.push(cur);
          channels.forEach(function(ch) { picker.appendChild(createButton(ch.name, ch.logo, ch.url, ch.groupTitle)); });
          dbg('Channels', channels.length + ' loaded', 'ok');
        });
    }
    window.onload = function() { start(); };
  </script>
</body>
</html>
